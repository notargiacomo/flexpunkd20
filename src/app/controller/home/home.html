<mat-card>
  <div class="row">
    <div class="col-sm-12">
      <h2><b>ATRIBUTOS FLEXPUNK D20</b></h2>
      <hr />
    </div>
  </div>
  <div class="row">
    <div class="col-6 label">
      <b style="font-size: large">{{ 'PONTOS GASTOS: ' + points }}</b>
    </div>
    <div class="col-6 d-flex gap-1 justify-content-end">
      <button class="button" (click)="limparAtributos()">Limpar Pontos</button>
    </div>
  </div>
  <br />
  @if (isMobile) {
    <mat-tab-group active-indicator-color="darkgoldenrod" inactive-label-text-color="darksalmon">
      <mat-tab class="tab" label="Calculo">
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="for"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="des"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="con"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="int"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="sab"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="car"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-12">
            <app-attribute
              [points]="points"
              [attribute]="sor"
              (changePoints)="calculaPontos($event)"
            ></app-attribute>
          </div>
        </div>
      </mat-tab>
      <mat-tab label="Explicação"> Content 2 </mat-tab>
      <mat-tab label="Imagem"> Content 3 </mat-tab>
    </mat-tab-group>
  } @else {
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="for"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="des"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="con"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="int"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="sab"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="car"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
    <br />
    <div class="row">
      <div class="col-3">
        <app-attribute
          [points]="points"
          [attribute]="sor"
          (changePoints)="calculaPontos($event)"
        ></app-attribute>
      </div>
    </div>
  }
</mat-card>
